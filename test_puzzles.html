<!doctype html>
<html>
  <head>
    <title>Chess 24 Puzzles Diagnostic</title>
    <script src="vendor/chess.min.js"></script>
    <style>
      body {
        font-family: monospace;
        padding: 20px;
        background: #1a1a2e;
        color: #eee;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        border: 1px solid #444;
        padding: 8px 12px;
        text-align: left;
        font-size: 13px;
      }
      th {
        background: #16213e;
      }
      .ok {
        color: #4ade80;
        font-weight: bold;
      }
      .fail {
        color: #f87171;
        font-weight: bold;
      }
      .badge {
        padding: 2px 6px;
        border-radius: 4px;
        font-size: 11px;
      }
      .beginner {
        background: #1e3a5f;
        color: #93c5fd;
      }
      .intermediate {
        background: #4a2c11;
        color: #fed7aa;
      }
      .advanced {
        background: #451a1a;
        color: #fca5a5;
      }
      h2 {
        color: #818cf8;
      }
    </style>
  </head>
  <body>
    <h2>Chess 24 Puzzles Validator — chess.js v0.10.3</h2>
    <table id="out">
      <tr>
        <th>#</th>
        <th>Category</th>
        <th>Title</th>
        <th>load()</th>
        <th>game_over at start?</th>
        <th>Steps Tested</th>
        <th>VERDICT</th>
      </tr>
    </table>

        {

        {

        // ==================== ADVANCED ====================
        {

        {

        {

          category: "Advanced",
          fen: "4kb1r/p2n1ppp/4p3/8/3P4/8/PPP2PPP/R1B1K1NR w KQk - 0 1",
          solution: ["c1f4"],
        },
        {
          id: "puzzle_21",

          category: "Advanced",

          solution: ["d1d8"],
        },
        {
          id: "puzzle_22",
          title: "Pawn Promotion Breakthrough",
          category: "Advanced",
          fen: "8/4P3/8/8/8/8/pk6/R3K3 w - - 0 1",
          solution: ["e7e8"],
        },
        {
          id: "puzzle_23",
          title: "Blackburne's Mate",
          category: "Advanced",
          fen: "6k1/5ppp/8/8/8/8/4QPPP/6K1 w - - 0 1",
          solution: ["e2e8"],
        },
        {
          id: "puzzle_24",
          title: "Grandmaster Endgame Trap",
          category: "Advanced",
          fen: "1r4k1/5ppp/8/8/8/8/5PPP/1R4K1 w - - 0 1",
          solution: ["b1b8"],
        },
      ];

      const tbody = document.getElementById("out");
      PUZZLES.forEach((p, i) => {
        const c = new Chess();
        const loaded = c.load(p.fen);
        const goAfterLoad = c.game_over();

        let allStepsValid = true;
        let stepDetails = [];
        if (loaded && !goAfterLoad) {
          for (let step of p.solution) {
            const from = step.slice(0, 2),
              to = step.slice(2, 4);
            const m = c.move({ from, to, promotion: "q" });
            if (!m) {
              allStepsValid = false;
              stepDetails.push(step + " (ILLEGAL)");
              break;
            } else {
              stepDetails.push(m.san);
            }
          }
        } else {
          allStepsValid = false;
        }

        const ok = loaded && !goAfterLoad && allStepsValid;
        const badgeClass = p.category.toLowerCase();
        tbody.innerHTML += `<tr>
    <td>${i + 1}</td>
    <td><span class="badge ${badgeClass}">${p.category}</span></td>
    <td>${p.title}</td>
    <td>${loaded ? '<span class="ok">true</span>' : '<span class="fail">false</span>'}</td>
    <td>${goAfterLoad ? '<span class="fail">true</span>' : '<span class="ok">false</span>'}</td>
    <td>${stepDetails.join(" → ")}</td>
    <td>${ok ? '<span class="ok">PASS</span>' : '<span class="fail">FAIL</span>'}</td>
  </tr>`;
      });
    </script>
  </body>
</html>
